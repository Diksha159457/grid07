[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid07-cognitive-combat"
version = "1.0.0"
description = "Autonomous persona routing, content generation, and adversarial reply engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Diksha Shahi" }
]
dependencies = []

[project.scripts]
grid07 = "grid07.cli:main"

[tool.setuptools]
packages = ["grid07"]

[project.optional-dependencies]
graph = ["langchain-core>=0.2.0", "langgraph>=0.2.0", "langchain-groq>=0.1.5"]
semantic = ["sentence-transformers>=2.7.0", "faiss-cpu>=1.8.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
